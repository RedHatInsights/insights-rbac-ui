# yaml-language-server: $schema=https://raw.githubusercontent.com/RedHatInsights/frontend-components/refs/heads/master/packages/config-utils/src/feo/spec/frontend-crd.schema.json
---
apiVersion: v1
kind: Template
metadata:
  name: rbac-frontend
objects:
  - apiVersion: cloud.redhat.com/v1alpha1
    kind: Frontend
    metadata:
      name: rbac
    spec:
      envName: ${ENV_NAME}
      title: RBAC
      deploymentRepo: https://github.com/RedHatInsights/insights-rbac-ui
      API:
        versions:
          - v1
        specs:
          - url: https://console.redhat.com/api/rbac/v1/openapi.json
            bundleLabels: ["iam"]
      frontend:
        paths:
          - /apps/rbac
      image: ${IMAGE}:${IMAGE_TAG}
      feoConfigEnabled: true
      searchEntries:
        - id: rbac-org-admin
          title: Org Admins
          href: /iam/user-access/users
          description: Manage your organization's administrator users (Identity & Access Management).
          alt_title: [org administrator, IAM, user access]
          permissions:
            - method: isKesselOrgOnboarded
              args: [false]
            - method: loosePermissions
              args: [[rbac:principal:read]]
        - id: rbac-org-admin-v2
          title: Org Admins
          href: /iam/access-management/users-and-user-groups
          description: Manage your organization's administrator users (Identity & Access Management).
          alt_title: [org administrator, IAM, user access]
          permissions:
            - method: isKesselOrgOnboarded
              args: [true]
            - method: loosePermissions
              args: [[rbac:principal:read]]
        - id: rbac-roles
          title: Roles
          href: /iam/user-access/roles
          description: View and manage custom roles for your organization (Identity & Access Management).
          alt_title: [role, roles, RBAC, IAM, user access]
          permissions:
            - method: isKesselOrgOnboarded
              args: [false]
            - method: loosePermissions
              args: [[rbac:role:read]]
        - id: rbac-roles-v2
          title: Roles
          href: /iam/access-management/roles
          description: View and manage custom roles for your organization (Identity & Access Management).
          alt_title: [role, roles, RBAC, IAM, user access]
          permissions:
            - method: isKesselOrgOnboarded
              args: [true]
            - method: loosePermissions
              args: [[rbac:role:read]]
        - id: rbac-users
          title: Users
          href: /iam/user-access/users
          description: Manage users and their role-based access (Identity & Access Management).
          alt_title: [user, users, IAM, user access, RBAC]
          permissions:
            - method: isKesselOrgOnboarded
              args: [false]
            - method: loosePermissions
              args: [[rbac:principal:read]]
        - id: rbac-users-v2
          title: Users
          href: /iam/access-management/users-and-user-groups
          description: Manage users and their role-based access (Identity & Access Management).
          alt_title: [user, users, IAM, user access, RBAC]
          permissions:
            - method: isKesselOrgOnboarded
              args: [true]
            - method: loosePermissions
              args: [[rbac:principal:read]]
        - id: rbac-groups
          title: Groups
          href: /iam/user-access/groups
          description: Manage groups and their role assignments (Identity & Access Management).
          alt_title: [group, groups, IAM, user access, RBAC]
          permissions:
            - method: isKesselOrgOnboarded
              args: [false]
            - method: loosePermissions
              args: [[rbac:group:read]]
        - id: rbac-groups-v2
          title: Groups
          href: /iam/access-management/users-and-user-groups
          description: Manage groups and their role assignments (Identity & Access Management).
          alt_title: [group, groups, IAM, user access, RBAC]
          permissions:
            - method: isKesselOrgOnboarded
              args: [true]
            - method: loosePermissions
              args: [[rbac:group:read]]
        - id: rbac-my-access
          title: My User Access
          href: /iam/my-user-access
          description: View your current permissions and access (Identity & Access Management).
          alt_title: [my access, my permissions, IAM, RBAC, user access]
          permissions:
            - method: isKesselOrgOnboarded
              args: [false]
        - id: rbac-my-access-v2
          title: My Access
          href: /iam/my-access
          description: View your current permissions and access (Identity & Access Management).
          alt_title: [my access, my permissions, IAM, RBAC, user access]
          permissions:
            - method: isKesselOrgOnboarded
              args: [true]
        - id: rbac-workspaces-v2
          title: Workspaces
          href: /iam/access-management/workspaces
          description: Organize systems with workspaces for granular user access (Identity & Access Management).
          alt_title: [workspace, workspaces, IAM, user access, RBAC]
          permissions:
            - method: isKesselOrgOnboarded
              args: [true]
        - id: rbac-access-management
          title: Access Management
          href: /iam/access-management/users-and-user-groups
          description: Manage users, groups, roles, and workspaces (Identity & Access Management).
          alt_title: [access management, IAM, user access, RBAC, roles, workspaces]
          permissions:
            - method: isKesselOrgOnboarded
              args: [true]
            - method: loosePermissions
              args:
                - - rbac:principal:read
                - - rbac:group:read
      serviceTiles:
        - section: iam
          group: iam
          id: users
          href: /iam/user-access/users
          title: Users
          description: Manage your organization's role-based access control (RBAC) to services.
          icon: PlaceholderIcon
          permissions:
            - method: isKesselOrgOnboarded
              args: [false]
            - method: loosePermissions
              args: [[rbac:principal:read]]
        - section: iam
          group: iam
          id: users-v2
          href: /iam/access-management/users-and-user-groups
          title: Users
          description: Manage your organization's role-based access control (RBAC) to services.
          icon: PlaceholderIcon
          permissions:
            - method: isKesselOrgOnboarded
              args: [true]
            - method: loosePermissions
              args: [[rbac:principal:read]]
        - section: iam
          group: iam
          id: groups
          href: /iam/user-access/groups
          title: Groups
          description: ""
          icon: PlaceholderIcon
          permissions:
            - method: isKesselOrgOnboarded
              args: [false]
            - method: loosePermissions
              args: [[rbac:group:read]]
        - section: iam
          group: iam
          id: groups-v2
          href: /iam/access-management/users-and-user-groups
          title: Groups
          description: ""
          icon: PlaceholderIcon
          permissions:
            - method: isKesselOrgOnboarded
              args: [true]
            - method: loosePermissions
              args: [[rbac:group:read]]
      bundleSegments:
        - segmentId: module-rbac-ui
          bundleId: iam
          navItems:
            # V2 navigation. Shown to tenants onboarded to Kessel V2 — either because
            # platform.rbac.workspaces is on for the environment, or because the tenant
            # converted itself ahead of the rollout.
            - id: overview
              title: Overview
              href: /iam/overview
              permissions:
                - method: isKesselOrgOnboarded
                  args:
                    - true
                - method: featureFlag
                  args:
                    - platform.rbac.overview
                    - true
                - method: loosePermissionsKessel
                  args:
                    - - rbac_roles_read
              product: Identity & Access Management
            - id: my-access
              title: My Access
              href: /iam/my-access
              permissions:
                - method: isKesselOrgOnboarded
                  args:
                    - true
            - id: access-management
              title: Access Management
              expandable: true
              permissions:
                - method: isKesselOrgOnboarded
                  args:
                    - true
              routes:
                - id: users-and-groups
                  title: Users and Groups
                  href: /iam/access-management/users-and-user-groups
                  permissions:
                    - method: loosePermissionsKessel
                      args:
                        - - rbac_principal_read
                          - rbac_groups_read
                  product: Identity & Access Management
                - id: roles
                  title: Roles
                  href: /iam/access-management/roles
                  permissions:
                    - method: loosePermissionsKessel
                      args:
                        - - rbac_roles_read
                  product: Identity & Access Management
                - id: workspaces
                  title: Workspaces
                  href: /iam/access-management/workspaces
                  icon: PlaceholderIcon
                  product: Identity & Access Management
                - id: audit-log
                  title: Audit Log
                  href: /iam/access-management/audit-log
                  permissions:
                    - method: isOrgAdmin
                  product: Identity & Access Management
                - segmentRef:
                    frontendName: service-accounts
                    segmentId: iam-access-management-service-accounts
            - id: organization-management
              title: Organization Management
              expandable: true
              permissions:
                - method: isKesselOrgOnboarded
                  args:
                    - true
                - method: isOrgAdmin
              routes:
                - id: organization-wide-access
                  title: Organization-Wide Access
                  href: /iam/organization-management/organization-wide-access
                  permissions:
                    - method: isOrgAdmin
                  product: Identity & Access Management
            # Legacy V1 navigation. Hidden as soon as the tenant is onboarded, so a converted
            # tenant is never offered links to pages its backend no longer populates.
            - id: my-user-access
              title: My User Access
              href: /iam/my-user-access
              permissions:
                - method: isKesselOrgOnboarded
                  args:
                    - false
            - id: user-access
              title: User Access
              expandable: true
              permissions:
                - method: loosePermissions
                  args:
                    - - rbac:principal:read
                    - - rbac:group:read
                    - - rbac:role:read
                    - - inventory:groups:read
                - method: isKesselOrgOnboarded
                  args:
                    - false
              routes:
                - id: user-access-overview
                  title: Overview
                  href: /iam/user-access/overview
                  permissions:
                    - method: featureFlag
                      args:
                        - platform.rbac.overview
                        - true
                    - method: loosePermissions
                      args:
                        - - rbac:*:read
                  product: Identity & Access Management
                - id: users
                  title: Users
                  href: /iam/user-access/users
                  permissions:
                    - method: loosePermissions
                      args:
                        - - rbac:principal:read
                  icon: PlaceholderIcon
                  product: Identity & Access Management
                - id: roles
                  title: Roles
                  href: /iam/user-access/roles
                  permissions:
                    - method: loosePermissions
                      args:
                        - - rbac:role:read
                  product: Identity & Access Management
                - id: groups
                  title: Groups
                  href: /iam/user-access/groups
                  permissions:
                    - method: loosePermissions
                      args:
                        - - rbac:group:read
                  icon: PlaceholderIcon
                  product: Identity & Access Management
                - segmentRef:
                    frontendName: access-requests
                    segmentId: iam-access-requests
          position: 100
      module:
        manifestLocation: /apps/rbac/fed-mods.json
        defaultDocumentTitle: User Access | Identity & Access Management
        config:
          ssoScopes:
            - api.console
            - api.iam.service_accounts
        modules:
          - id: settings-user-access
            module: ./SettingsUserAccess
            routes:
              - pathname: /settings/rbac
          - id: iam-user-access
            module: ./Iam
            routes:
              - pathname: /iam
      locales:
        ja:
          bundleSegments.iam.module-rbac-ui.navItems.access-management.routes.audit-log.product: アイデンティティーとアクセス管理
          bundleSegments.iam.module-rbac-ui.navItems.access-management.routes.audit-log.title: 監査ログ
          bundleSegments.iam.module-rbac-ui.navItems.access-management.routes.roles.product: アイデンティティーとアクセス管理
          bundleSegments.iam.module-rbac-ui.navItems.access-management.routes.roles.title: ロール
