          bundleSegments.iam.module-rbac-ui.navItems.organization-management.routes.organization-wide-access.title: 組織全体でのアクセス
          bundleSegments.iam.module-rbac-ui.navItems.organization-management.title: 組織管理
          bundleSegments.iam.module-rbac-ui.navItems.overview.product: アイデンティティーとアクセス管理
          bundleSegments.iam.module-rbac-ui.navItems.overview.title: 概要
          bundleSegments.iam.module-rbac-ui.navItems.user-access.routes.groups.product: アイデンティティーとアクセス管理
          bundleSegments.iam.module-rbac-ui.navItems.user-access.routes.groups.title: グループ
          bundleSegments.iam.module-rbac-ui.navItems.user-access.routes.roles.product: アイデンティティーとアクセス管理
          bundleSegments.iam.module-rbac-ui.navItems.user-access.routes.roles.title: ロール
