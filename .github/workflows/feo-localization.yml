name: Check FEO localization POC

on:
  pull_request:
    paths:
      - deploy/frontend.yaml
      - deploy/locales/**
      - .github/i18n/feo-phrase-tms.json
      - .github/workflows/feo-localization.yml
      - package.json
      - patches/@redhat-cloud-services+frontend-components-config-utilities+4.12.6.patch
  push:
    branches: [RHCLOUD-52058]
    paths:
      - deploy/frontend.yaml
      - deploy/locales/**
      - .github/i18n/feo-phrase-tms.json
      - .github/workflows/feo-localization.yml
      - package.json
      - patches/@redhat-cloud-services+frontend-components-config-utilities+4.12.6.patch

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Phrase-independent tooling from RHCLOUD-52057; replace with a released ref after merge.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: RedHatInsights/i18n-tooling
          ref: 0eeb91220dee0af4b4c8f996a59d4e09e51488fe
          path: i18n-tooling-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: i18n-tooling-source
      - run: npm run build --workspace @redhat-cloud-services/i18n-pipeline
        working-directory: i18n-tooling-source
      - name: Generate English catalog from Frontend YAML
        run: node i18n-tooling-source/packages/i18n-pipeline/dist/cli.js feo extract --template deploy/frontend.yaml --output "$RUNNER_TEMP/insights-rbac-ui-feo-frontend-en.json"
      - name: Verify inlined zh-CN catalog
        run: node i18n-tooling-source/packages/i18n-pipeline/dist/cli.js feo inline --template deploy/frontend.yaml --source "$RUNNER_TEMP/insights-rbac-ui-feo-frontend-en.json" --target deploy/locales/zh-CN.json --locale zh-CN --check

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
      - run: npm ci
      - run: npm run build
