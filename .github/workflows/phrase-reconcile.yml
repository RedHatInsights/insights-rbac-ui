  # to reconcile completed Phrase jobs on RHCLOUD-51618.
  push:
    branches:
      - RHCLOUD-51618
    paths:
      - .github/i18n/phrase-reconcile.pilot

permissions: {}

jobs:
  reconcile:
    # TEMPORARY POC GUARD — restore to master before merge.
    if: github.ref == 'refs/heads/RHCLOUD-51618'
