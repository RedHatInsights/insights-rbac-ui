name: i18n App smoke test

# Configure I18N_APP_CLIENT_ID as an Actions variable and I18N_APP_PRIVATE_KEY
# as an Actions secret containing the complete PEM private key.
on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create repository-scoped App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.I18N_APP_CLIENT_ID }}
          private-key: ${{ secrets.I18N_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create branch, commit, PR, and verify
        uses: actions/github-script@v8
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const repositoryName = `${owner}/${repo}`;
            const { data: scope } = await github.rest.apps.listReposAccessibleToInstallation();
            if (scope.total_count !== 1 || scope.repositories[0]?.full_name !== repositoryName) {
              throw new Error(`Expected token scoped only to ${repositoryName}`);
            }

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const base = repository.default_branch;
            const branch = `i18n/phrase-app-smoke-${context.runId}-${context.runAttempt}`;
            const { data: reference } = await github.rest.git.getRef({
              owner, repo, ref: `heads/${base}`,
            });

            await github.rest.git.createRef({
              owner, repo, ref: `refs/heads/${branch}`, sha: reference.object.sha,
            });
            core.info(`Created branch: ${branch}`);

            // Contents API supplies the App's bot identity and GitHub signature.
            // Do not override author, committer, or signature information.
            const { data: change } = await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch,
              path: '.github/i18n-state/app-smoke-test.json',
              message: 'chore: verify i18n GitHub App access',
              content: Buffer.from(JSON.stringify({
                ticket: 'RHCLOUD-52199',
                runId: context.runId,
                runAttempt: context.runAttempt,
              }, null, 2) + '\n').toString('base64'),
            });

            const { data: pr } = await github.rest.pulls.create({
              owner, repo, base, head: branch,
              title: 'chore: verify i18n GitHub App access',
              body: 'Smoke test for RHCLOUD-52199. Close without merging and delete the test branch after recording evidence.',
              draft: true,
            });
            core.info(`PR: ${pr.html_url}`);

            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: change.commit.sha,
            });
            const expectedAuthor = `${process.env.APP_SLUG}[bot]`;
            const author = commit.author?.login;
            const { verified, reason } = commit.commit.verification;

            await core.summary
              .addHeading('i18n GitHub App smoke test')
              .addTable([
                [{ data: 'Check', header: true }, { data: 'Result', header: true }],
                ['Token repository scope', repositoryName],
                ['Branch', branch],
                ['Expected author', expectedAuthor],
                ['Actual author', author ?? 'Unknown'],
                ['Verified signature', String(verified)],
                ['Verification reason', reason],
              ])
              .addLink('Draft pull request', pr.html_url)
              .addRaw('\n\n')
              .addLink('Commit', commit.html_url)
              .addRaw('\n\nClose the draft PR without merging and delete its branch after recording evidence.\n')
              .write();

            if (author !== expectedAuthor || verified !== true) {
              core.setFailed(
                `Expected verified commit by ${expectedAuthor}; ` +
                `got author=${author}, verified=${verified}, reason=${reason}`
              );
            }
