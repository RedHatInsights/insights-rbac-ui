name: Storybook
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: './.github/actions/setup-environment'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  storybook:
    uses: riccardo-forina/shared-workflows/.github/workflows/reusable-storybook.yml@a00242d3a97c97100f8427494604e78cc9bf47d2
    with:
      node-version: '24.15.0'
