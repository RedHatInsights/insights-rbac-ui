name: Chromatic Upload

on:
  workflow_run:
    workflows: ["Storybook"]
    types: [completed]

concurrency:
  group: chromatic-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  chromatic:
    uses: RedHatInsights/experience-ui-governance/.github/workflows/reusable-chromatic.yml@5b1eaab981d12bbaad76737b93049f99df04861c # main
    secrets:
      chromatic-project-token: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
