name: Chromatic Upload

on:
  workflow_run:
    workflows: ["Storybook"]
    types: [completed]

concurrency:
  group: chromatic-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  chromatic:
    uses: RedHatInsights/experience-ui-governance/.github/workflows/reusable-chromatic.yml@1ea4c3f042b92cb3a0ea0eb2d31773998b600489 # main
    secrets:
      chromatic-project-token: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
